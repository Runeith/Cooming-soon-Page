<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runeith — Coming Soon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stage">
    <div class="bg-texture"></div>
    <div class="bg-tint"></div>
    <div class="bg-inner-shadow"></div>
    <div class="bg-vignette"></div>

    <div class="gate">
      <div class="gate-inner">
        <div class="gate-image"></div>
      </div>
    </div>

    <div class="amulet">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="47" fill="none" stroke="#e7c76b" stroke-width="2" opacity="0.85"></circle>
        <g transform="translate(50,50)">
          <g transform="rotate(0)"><path d="M -26 0 A30 30 0 0 1 26 0 A30 30 0 0 1 -26 0 Z" fill="rgba(231,199,107,0.22)" stroke="#f0d69a" stroke-width="2.5"></path></g>
          <g transform="rotate(120)"><path d="M -26 0 A30 30 0 0 1 26 0 A30 30 0 0 1 -26 0 Z" fill="rgba(231,199,107,0.22)" stroke="#f0d69a" stroke-width="2.5"></path></g>
          <g transform="rotate(240)"><path d="M -26 0 A30 30 0 0 1 26 0 A30 30 0 0 1 -26 0 Z" fill="rgba(231,199,107,0.22)" stroke="#f0d69a" stroke-width="2.5"></path></g>
          <circle cx="0" cy="0" r="7" fill="#1a120b" stroke="#f0d69a" stroke-width="2"></circle>
        </g>
      </svg>
      <div class="amulet-letter">R</div>
    </div>

    <div id="floating-items" class="floating-items"></div>

    <div class="panel">
      <div class="panel-title">Runeith</div>
      <div class="panel-subtitle">Now Online!</div>
      <div class="panel-tagline">A new OSRS RSPS server</div>

      <div id="countdown" class="countdown">
        <div class="countdown-unit">
          <div id="cd-days" class="countdown-value">00</div>
          <div class="countdown-label">Days</div>
        </div>
        <div class="countdown-unit">
          <div id="cd-hours" class="countdown-value">00</div>
          <div class="countdown-label">Hours</div>
        </div>
        <div class="countdown-unit">
          <div id="cd-mins" class="countdown-value">00</div>
          <div class="countdown-label">Min</div>
        </div>
        <div class="countdown-unit">
          <div id="cd-secs" class="countdown-value">00</div>
          <div class="countdown-label">Sec</div>
        </div>
      </div>

      <a id="discord-link" href="https://discord.gg/runeith" target="_blank" rel="noopener" class="discord-link">
        <span class="discord-icon"></span>
        Join our Discord
      </a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
